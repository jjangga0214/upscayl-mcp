<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Upscayl · 이미지 작업실</title>
    <link rel="describedby" type="application/json" href="/manifest.json" />
    <link rel="stylesheet" href="/studio/style.css" />
    <script type="module" src="/studio/app.js"></script>
  </head>
  <body>
    <svg aria-hidden="true" class="symbols" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="pic" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="16" rx="3" />
          <circle cx="8.5" cy="9" r="1.5" />
          <path d="m4 17 5-5 3 3 3-4 6 6" />
        </symbol>
        <symbol id="folder" viewBox="0 0 24 24">
          <path
            d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
          />
        </symbol>
        <symbol id="split" viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="M12 2v20" />
        </symbol>
        <symbol id="lens" viewBox="0 0 24 24">
          <circle cx="10" cy="10" r="6" />
          <path d="m15 15 5 5" />
        </symbol>
        <symbol id="expand" viewBox="0 0 24 24">
          <path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5" />
        </symbol>
        <symbol id="sliders" viewBox="0 0 24 24">
          <path d="M4 8h6m4 0h6M4 16h9m4 0h3" />
          <circle cx="12" cy="8" r="2" />
          <circle cx="15" cy="16" r="2" />
        </symbol>
        <symbol id="spark" viewBox="0 0 24 24">
          <path
            d="m12 2 2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4zM20 16v5m-2.5-2.5h5"
          />
        </symbol>
        <symbol id="download" viewBox="0 0 24 24">
          <path d="M12 3v11m-4-4 4 4 4-4M4 16v4h16v-4" />
        </symbol>
        <symbol id="chev" viewBox="0 0 24 24">
          <path d="m8 10 4 4 4-4" />
        </symbol>
        <symbol id="external" viewBox="0 0 24 24">
          <path d="M7 17 17 7M7 7h10v10" />
        </symbol>
      </defs>
    </svg>
    <header class="topbar">
      <div class="brand">
        <svg width="35" height="36" viewBox="0 0 40 40" aria-hidden="true">
          <path fill="#b7a4ff" d="m3 24 15-15h9L12 24z" />
          <path fill="#e2d8ff" d="M18 4h18v18l-6-6V10h-6z" />
          <path fill="#8874e7" d="M3 27h11l16-16v11L16 36H3z" /></svg
        ><strong>Upscayl</strong>
      </div>
      <span class="divider"></span><span class="app-name">이미지 작업실</span>
      <div class="top-right">
        <span id="connection"><i></i>서버 연결 중</span
        ><a href="/setup"
          >연결 및 설치 <svg><use href="#external" /></svg
        ></a>
      </div>
    </header>
    <main>
      <aside class="controls" aria-label="확대 설정">
        <h1>업스케일</h1>
        <form id="form">
          <fieldset id="settings">
            <section>
              <h2>입력 이미지</h2>
              <div class="filecard">
                <img id="thumb" src="/studio/sample.jpg" alt="" />
                <div>
                  <b id="filename">rainier.jpg</b
                  ><small id="filemeta">320 × 216 px · 예제</small>
                </div>
              </div>
              <div class="file-actions">
                <button type="button" id="select">
                  <svg><use href="#pic" /></svg>이미지 열기</button
                ><button type="button" id="folders">
                  <svg><use href="#folder" /></svg>폴더 열기
                </button>
              </div>
              <input
                id="files"
                type="file"
                accept="image/png,image/jpeg,image/webp,.jfif"
                multiple
                hidden
              /><input
                id="directory"
                type="file"
                webkitdirectory
                multiple
                hidden
              />
            </section>
            <section>
              <label class="heading" for="model">AI 모델</label>
              <div class="selectwrap">
                <select id="model">
                  <option value="upscayl-standard-4x">
                    Upscayl Standard
                  </option></select
                ><svg><use href="#chev" /></svg>
              </div>
              <p class="hint" id="modelhint">
                사진과 일러스트에 두루 쓰는 기본 모델
              </p>
            </section>
            <section>
              <h2>출력 크기</h2>
              <div class="size-choices" aria-label="출력 배율">
                <button type="button" data-scale="2">2×</button
                ><button
                  type="button"
                  data-scale="4"
                  class="active"
                  aria-pressed="true"
                >
                  4×</button
                ><button type="button" data-scale="8">8×</button
                ><button type="button" data-scale="custom">직접 지정</button>
              </div>
              <div id="custom" hidden>
                <label
                  >기준<select id="sizekind">
                    <option value="scale">배율</option>
                    <option value="width">가로 너비 (px)</option>
                  </select></label
                ><label
                  ><span id="number-label">배율</span
                  ><input
                    type="number"
                    id="customsize"
                    required
                    min="1"
                    max="16"
                    value="3"
                    step="1"
                /></label>
              </div>
              <div class="switchrow">
                <label for="double">Double Upscayl</label
                ><input class="switch" id="double" type="checkbox" />
              </div>
            </section>
            <section>
              <h2>저장 형식</h2>
              <div class="formats" aria-label="저장 형식">
                <button
                  type="button"
                  data-format="png"
                  class="active"
                  aria-pressed="true"
                >
                  PNG</button
                ><button type="button" data-format="jpg">JPG</button
                ><button type="button" data-format="webp">WebP</button>
              </div>
            </section>
            <details>
              <summary>
                <svg><use href="#sliders" /></svg>고급 설정
                <svg><use href="#chev" /></svg>
              </summary>
              <div class="advanced">
                <label
                  >압축 (0–100)<input
                    type="number"
                    id="compression"
                    min="0"
                    max="100"
                    value="0"
                    required /></label
                ><label
                  >타일 크기<input
                    type="number"
                    id="tile"
                    min="0"
                    max="8192"
                    value="0"
                    required /></label
                ><label
                  >GPU ID<input
                    id="gpu"
                    placeholder="자동"
                    pattern="[0-9]+(,[0-9]+)*"
                /></label>
                <div class="switchrow">
                  <label for="tta">TTA 모드</label
                  ><input class="switch" type="checkbox" id="tta" />
                </div>
              </div>
            </details>
          </fieldset>
          <div class="runbox">
            <button class="primary" id="run" type="submit" disabled>
              <svg><use href="#spark" /></svg><span>이미지 확대</span></button
            ><button type="button" id="stop" hidden>작업 취소</button
            ><small>서버의 작업 파일은 완료 5분 후 삭제됩니다.</small>
          </div>
        </form>
      </aside>
      <div class="workarea" id="workarea">
        <div class="workhead">
          <div>
            <h2>미리보기</h2>
            <span id="sourcebadge">예제 이미지</span>
          </div>
          <div class="viewtools">
            <div class="toolgroup">
              <button
                type="button"
                id="sliderMode"
                class="sel"
                aria-pressed="true"
              >
                <svg><use href="#split" /></svg>슬라이더</button
              ><button type="button" id="lensMode" aria-pressed="false">
                <svg><use href="#lens" /></svg>렌즈
              </button>
            </div>
            <button
              type="button"
              id="actual"
              aria-label="실제 픽셀 크기로 보기"
              title="실제 픽셀 크기로 보기"
              aria-pressed="false"
            >
              <svg><use href="#expand" /></svg><span>1:1</span>
            </button>
          </div>
        </div>
        <div class="canvas" id="canvas">
          <div class="frame" id="frame" style="--split: 48%">
            <img
              id="after"
              src="/studio/sample-4x.png"
              alt="확대 결과"
              draggable="false"
            /><img
              id="before"
              src="/studio/sample.jpg"
              alt="원본 이미지"
              draggable="false"
            /><span class="imlabel original">원본</span
            ><span class="imlabel result" id="rightlabel">4× 확대</span>
            <div id="rule"><span>‹ ›</span></div>
            <input
              type="range"
              id="wipe"
              min="0"
              max="100"
              value="48"
              aria-label="원본과 결과 비교 위치"
            />
          </div>
        </div>
        <div class="caption">
          <div>
            <strong id="previewname">rainier.jpg</strong
            ><span id="dims">320 × 216 <em>→</em> 1280 × 864 px</span>
          </div>
          <button type="button" id="save">
            <svg><use href="#download" /></svg>결과 저장
          </button>
        </div>
        <div id="batchbar" hidden>
          <label for="item">파일 목록</label
          ><select id="item"></select
          ><button id="saveall" type="button" disabled>ZIP 저장</button>
        </div>
        <div class="status">
          <span id="status" role="status"
            >이미지를 끌어놓거나 파일을 열어 시작하세요.</span
          ><progress id="progress" hidden></progress>
        </div>
      </div>
    </main>
  </body>
</html>
