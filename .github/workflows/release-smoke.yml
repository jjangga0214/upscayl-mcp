name: Release executables
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
permissions:
  contents: read
jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: linux-x64
          - os: ubuntu-24.04-arm
            asset: linux-arm64
          - os: windows-2025
            asset: windows-x64
          - os: macos-15
            asset: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Fetch released files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          ASSET: ${{ matrix.asset }}
          REPO: ${{ github.repository }}
        shell: bash
        run: gh release download "$TAG" -R "$REPO" -p "upscayl-mcp-$ASSET.zip" -p SHA256SUMS
      - name: Verify checksum, execute CLI and install skill
        shell: python
        run: |
          import hashlib, pathlib, subprocess, zipfile
          root = pathlib.Path.cwd()
          archive, = root.glob("*.zip")
          sums = dict(line.split()[::-1] for line in pathlib.Path("SHA256SUMS").read_text().splitlines())
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == sums[archive.name]
          with zipfile.ZipFile(archive) as z:
              z.extractall("release")
          exe, = (root/"release").glob("upscayl-mcp*")
          exe.chmod(0o755)
          subprocess.run([exe, "--version"], check=True)
          subprocess.run([exe, "upscale", "--help"], check=True)
          subprocess.run([exe, "skill", "install"], check=True)
          assert (pathlib.Path.home()/".agents/skills/upscayl/SKILL.md").is_file()
